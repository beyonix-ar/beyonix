# Incluir dentro del server HTTPS de beyonix.com.ar, una sola vez.
client_max_body_size 8m;
limit_req_status 429;
limit_req zone=beyonix_general burst=200 nodelay;
limit_req zone=beyonix_auth burst=30 nodelay;
limit_req zone=beyonix_external burst=40 nodelay;
limit_req zone=beyonix_csp burst=10 nodelay;

# TRACE no es necesario; OPTIONS y los métodos de la API quedan intactos.
if ($request_method = TRACE) { return 405; }
