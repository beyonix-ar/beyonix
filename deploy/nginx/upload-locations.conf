# Incluir dentro del mismo server HTTPS. Límites de body específicos por ruta:
# comprobantes (5 MB en la app) y reclamos (hasta 6 videos de 40 MB).
# Replican las opciones de proxy del `location /` actual; proxy_pass sin URI
# conserva el path y la query string originales.
location = /api/payment-proofs {
    client_max_body_size 6m;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

location ~ ^/api/orders/[0-9]+/claims$ {
    client_max_body_size 255m;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}
