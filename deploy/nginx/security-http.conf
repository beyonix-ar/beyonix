# Incluir una sola vez dentro de http {}, después de cloudflare-real-ip.conf.
# Una clave vacía no consume cuota. Los límites se aplican por IP real validada.
# ssl_protocols NO va acá: nginx.conf ya lo define en http {} y duplicarlo hace
# fallar `nginx -t`. Se corrige editando esa línea (ver README).
map $uri $beyonix_auth_rate_key {
    default "";
    ~^/api/auth/(login|forgot-password|resend-confirmation|confirmation-status|confirm-email)$ $binary_remote_addr;
}
map $uri $beyonix_external_rate_key {
    default "";
    ~^/api/andreani/(cotizar|destinos|tracking)$ $binary_remote_addr;
    ~^/api/mercadopago/(installments|create-preference)$ $binary_remote_addr;
    /api/payment-methods $binary_remote_addr;
    /api/customer-credit/mercadopago/reconcile $binary_remote_addr;
    ~^/api/transferencia/create-order$ $binary_remote_addr;
    ~^/api/(orders|payment-proofs)(/|$) $binary_remote_addr;
    ~^/api/reviews(/|$) $binary_remote_addr;
}
map $uri $beyonix_csp_rate_key {
    default "";
    /api/csp-report $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=beyonix_general:20m rate=50r/s;
limit_req_zone $beyonix_auth_rate_key zone=beyonix_auth:10m rate=30r/m;
limit_req_zone $beyonix_external_rate_key zone=beyonix_external:10m rate=2r/s;
limit_req_zone $beyonix_csp_rate_key zone=beyonix_csp:10m rate=1r/s;
